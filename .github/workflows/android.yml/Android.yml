
name: Gerar APK FF PROXY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          unzip -q FF_PROXY_GitHub_Build.zip
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          chmod +x FF_PROXY_Android/gradlew
          ./FF_PROXY_Android/gradlew -p FF_PROXY_Android assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-PROXY-APK
          path: FF_PROXY_Android/app/build/outputs/apk/debug/*.apk
